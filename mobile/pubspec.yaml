name: apm
description: "APM — Anglais Pour Moi (mobile app)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/fraunces/OFL.txt
    - assets/fonts/inter/OFL.txt

  # Polices de marque (DESIGN_SPEC §3), bundlées pour un rendu hors-ligne
  # dès le premier lancement et des tests déterministes. Licences : OFL
  # (assets/fonts/*/OFL.txt, enregistrées dans le LicenseRegistry).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/fraunces/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/fraunces/Fraunces-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/fraunces/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/fraunces/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
