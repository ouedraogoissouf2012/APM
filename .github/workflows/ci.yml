name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm_dev_password
          POSTGRES_DB: apm_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U apm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://apm:apm_dev_password@localhost:5434/apm
      DATABASE_URL_TEST: postgresql+asyncpg://apm:apm_dev_password@localhost:5434/apm_test
      JWT_SECRET: ci-secret-not-for-production
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Tests (pytest)
        run: uv run pytest -q
