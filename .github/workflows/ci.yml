name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apm
          POSTGRES_PASSWORD: apm_dev_password
          POSTGRES_DB: apm_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U apm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://apm:apm_dev_password@localhost:5434/apm
      DATABASE_URL_TEST: postgresql+asyncpg://apm:apm_dev_password@localhost:5434/apm_test
      JWT_SECRET: ci-secret-not-for-production
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type check (mypy)
        run: uv run mypy app
      - name: Tests (pytest)
        run: uv run pytest -q

  pronunciation:
    name: Pronunciation service (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pronunciation-service
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Core + dev deps only — NOT the heavy `ml` extra (torch + ~1 GB model).
      # Lazy imports let ruff/mypy/pure-logic tests run without it; the audio/e2e
      # tests skip cleanly when the ML stack is absent (they run locally/in Docker).
      - name: Install dependencies (no ML stack)
        run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check src tests scripts
      - name: Format check (ruff)
        run: uv run ruff format --check src tests scripts
      - name: Type check (mypy)
        run: uv run mypy src
      - name: Tests (pure logic; audio/e2e skip without ML stack)
        run: uv run pytest -q

  mobile:
    name: Mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
