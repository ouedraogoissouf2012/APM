services:
  postgres:
    image: postgres:17-alpine
    container_name: apm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm_dev_password
      POSTGRES_DB: apm
    ports:
      - "5434:5432"  # host 5434 -> container 5432 (5432 = local PostgreSQL, 5433 = projet wourri)
    volumes:
      - apm_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apm_pgdata:
