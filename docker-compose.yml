services:
  postgres:
    image: postgres:17-alpine
    container_name: apm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apm
      POSTGRES_PASSWORD: apm_dev_password
      POSTGRES_DB: apm
    ports:
      # host 6544 -> container 5432. 5432 = local PostgreSQL, 5433/5434 fall in a
      # Windows WinNAT reserved range (5433-5532) that Docker cannot bind.
      - "6544:5432"
    volumes:
      - apm_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm -d apm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: apm-redis
    profiles: ["app"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full API stack: `docker compose --profile app up`. Local `uvicorn` still
  # works without this. Staging/production MUST set APP_ENV=production (#433).
  api:
    build:
      context: ./backend
    container_name: apm-api
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://apm:apm_dev_password@postgres:5432/apm
      DATABASE_URL_TEST: postgresql+asyncpg://apm:apm_dev_password@postgres:5432/apm_test
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Phoneme-level pronunciation scoring (GOP via wav2vec2). Heavy (~2-3 GB image),
  # so it is opt-in behind the `ml` profile: `docker compose --profile ml up`.
  # The main stack (postgres, backend) runs without it.
  pronunciation:
    build:
      context: ./pronunciation-service
    container_name: apm-pronunciation
    profiles: ["ml"]
    restart: unless-stopped
    ports:
      # Bound to loopback only (#231): the service has no auth of its own beyond
      # the shared secret below, so it must not be reachable from the network —
      # only the backend, running on the same host, needs it.
      - "127.0.0.1:8100:8100"
    environment:
      APP_ENV: dev
      LOG_LEVEL: info
      DEVICE: cpu
      # Shared secret the backend must also send (its GOP_SERVICE_SECRET) as
      # X-Internal-Secret (#231). Empty here by default; set both to lock it down.
      INTERNAL_SECRET: ${PRONUNCIATION_INTERNAL_SECRET:-}
    # Cache HuggingFace weights across restarts so the model downloads only once.
    volumes:
      - apm_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  apm_pgdata:
  apm_hf_cache:
